apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommadationservice
  labels:
    app.kubernetes.io/name: recommadationservice
    app.kubernetes.io/instance: recommadationservice
    app.kubernetes.io/component: service
    app.kubernetes.io/owner: online-boutique
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: recommadationservice
      app.kubernetes.io/instance: recommadationservice
      app.kubernetes.io/component: service
      app.kubernetes.io/owner: online-boutique
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommadationservice
        app.kubernetes.io/instance: recommadationservice
        app.kubernetes.io/component: service
        app.kubernetes.io/owner: online-boutique
    spec:
    # TOPOLOGY SPREAD CONSTRAINTS - Distribute pods across nodes AND availability zones
      topologySpreadConstraints:
        # Spread across nodes (within same AZ)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: recommadationservice
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: recommadationservice
        
        # Spread across availability zones
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: recommadationservice
              app.kubernetes.io/component: service
              app.kubernetes.io/instance: recommadationservice    
      # THIS IS CRITICAL - Forces pods to run ONLY on spot nodes
      nodeSelector:
        karpenter.sh/capacity-type: spot
      serviceAccountName: recommadationservice
      securityContext:
        fsGroup: 1000
      containers:
        - name: recommadationservice
          envFrom:
            - configMapRef:
                name: recommadationservice
          securityContext:
            capabilities:
              add:
              - NET_BIND_SERVICE
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: 927749346049.dkr.ecr.ap-southeast-1.amazonaws.com/online-boutique/recommendationservice:v0.0
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
          readinessProbe:
            periodSeconds: 5
            grpc:
              port: 8080
          livenessProbe:
            periodSeconds: 5
            grpc:
              port: 8080
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 128m
              memory: 512Mi
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory

