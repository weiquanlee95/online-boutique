# Global defaults applied to every service unless overridden
global:
  namespace: default
  owner: online-boutique
  imageRegistry: 927749346049.dkr.ecr.ap-southeast-1.amazonaws.com/online-boutique
  imagePullPolicy: IfNotPresent
  spotOnly: true
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    capabilities:
      add: [NET_BIND_SERVICE]
      drop: [ALL]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 128m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 2

# Per-service configuration. Set enabled=false to skip a service.
services:
  adservice:
    enabled: true
    replicas: 3
    image:
      repository: adservice
      tag: v0.1
    port:
      name: grpc
      containerPort: 9555
      servicePort: 9555
      protocol: TCP
    probe:
      type: grpc
      port: 9555
    env:
      PORT: "9555"

  cartservice:
    enabled: true
    replicas: 3
    image:
      repository: cartservice
      tag: v0.1
    containerName: server
    port:
      name: grpc
      containerPort: 7070
      servicePort: 7070
      protocol: TCP
    probe:
      type: grpc
      port: 7070
      initialDelaySeconds: 15
    resources:
      requests:
        cpu: 200m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      privileged: false
      readOnlyRootFilesystem: true
    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    terminationGracePeriodSeconds: 5
    env:
      REDIS_ADDR: "redis-cart:6379"

  checkoutservice:
    enabled: true
    replicas: 3
    image:
      repository: checkoutservice
      tag: v0.0
    port:
      name: grpc
      containerPort: 5050
      servicePort: 5050
      protocol: TCP
    probe:
      type: grpc
      port: 5050
    env:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:5000"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"

  currencyservice:
    enabled: true
    replicas: 3
    image:
      repository: currencyservice
      tag: v0.1
    port:
      name: grpc
      containerPort: 7000
      servicePort: 7000
      protocol: TCP
    probe:
      type: grpc
      port: 7000
    env:
      PORT: "7000"
      DISABLE_PROFILER: "1"

  emailservice:
    enabled: true
    replicas: 3
    image:
      repository: emailservice
      tag: v0.0
    port:
      name: grpc
      containerPort: 8080
      servicePort: 5000
      protocol: TCP
    probe:
      type: grpc
      port: 8080
    env:
      PORT: "8080"
      DISABLE_PROFILER: "1"

  frontend:
    enabled: true
    replicas: 3
    image:
      repository: frontend
      tag: v0.0
    port:
      name: http
      containerPort: 8080
      servicePort: 80
      protocol: TCP
    probe:
      type: http
      path: /_healthz
      port: 8080
      initialDelaySeconds: 10
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      AD_SERVICE_ADDR: "adservice:9555"
      SHOPPING_ASSISTANT_SERVICE_ADDR: "shoppingassistantservice:80"

  loadgenerator:
    enabled: true
    replicas: 1
    image:
      repository: loadgenerator
      tag: v0.0
    spotOnly: false
    service:
      enabled: false
    hpa:
      enabled: false
    pdb:
      enabled: false
    port:
      containerPort: 8089
      protocol: TCP
    probe:
      type: none
    env:
      FRONTEND_ADDR: "frontend:80"
      USERS: "50000"
      RATE: "5"

  paymentservice:
    enabled: true
    replicas: 3
    image:
      repository: paymentservice
      tag: v0.0
    port:
      containerPort: 50051
      servicePort: 50051
      protocol: TCP
    probe:
      type: grpc
      port: 50051
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"

  productcatalogservice:
    enabled: true
    replicas: 3
    image:
      repository: productcatalogservice
      tag: v0.0
    port:
      containerPort: 3550
      servicePort: 3550
      protocol: TCP
    probe:
      type: grpc
      port: 3550
    env:
      PORT: "3550"
      DISABLE_PROFILER: "1"

  recommadationservice:
    enabled: true
    replicas: 3
    image:
      repository: recommendationservice
      tag: v0.0
    port:
      containerPort: 8080
      servicePort: 8080
      protocol: TCP
    probe:
      type: grpc
      port: 8080
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      DISABLE_PROFILER: "1"

  shippingservice:
    enabled: true
    replicas: 3
    image:
      repository: shippingservice
      tag: v0.0
    port:
      name: grpc
      containerPort: 50051
      servicePort: 50051
      protocol: TCP
    probe:
      type: grpc
      port: 50051
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"

# Optional dependency: in-cluster Redis used by cartservice
redisCart:
  enabled: true
  image: redis:alpine
  port: 6379
  resources:
    limits:
      cpu: 125m
      memory: 256Mi
    requests:
      cpu: 70m
      memory: 200Mi

# Optional ALB ingress for the frontend
ingress:
  enabled: true
  className: alb
  serviceName: frontend
  servicePort: 80
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
  path: /
  pathType: Prefix
